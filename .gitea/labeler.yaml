# https://github.com/actions/labeler

actions:
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**
          - .forgejo/workflows/**
          - .gitea/workflows/**

nix:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.nix"
          - "**/flake.lock"

javascript:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.{js,jsx,mjs,cjs}"
          - "**/package.json"
          - "**/package-lock.json"

typescript:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.{ts,tsx,mts,cts}"
          - "**/tsconfig*.json"
