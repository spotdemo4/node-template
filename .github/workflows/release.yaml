name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Initialize
        uses: spotdemo4/nix-init@b1822eb9aa4cd7879d84810e15b184ebefc4fa91 # v1.62.0
        with:
          fetch_depth: 0
          dev_shell: release

      - name: Release to GitHub
        run: flake-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES: |
            appimages.x86_64-linux.default.aarch64-unknown-linux-gnu
            appimages.x86_64-linux.default.armv7l-unknown-linux-gnueabihf
            appimages.x86_64-linux.default.x86_64-unknown-linux-gnu
            images.x86_64-linux.default.aarch64-unknown-linux-gnu
            images.x86_64-linux.default.armv7l-unknown-linux-gnueabihf
            images.x86_64-linux.default.x86_64-unknown-linux-gnu

      # - name: Release to NPM
      #   run: npm publish --access public
